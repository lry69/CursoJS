<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>Panel de actividades</title>
  </head>
  <body>
    <header>
      <h1>Mi panel de actividades</h1>
    </header>
    <main>
      <section>
        <h2>Tareas de hoy</h2>
        <ol>
          <li>Terminar Módulos 0 y 1<span class="badge-prioridad">alta</span></li>
          <li>Preparar los Informes <span class="badge-prioridad">media</span></li>
          <li>Leer el Correo Electrónico <span class="badge-prioridad">Baja</span></li>
        </ol>
      </section>
      <section>
        <h2>Nueva tarea</h2>
	<form>

  	<div>
    	<label for="titulo">Título de la tarea</label>
    	<input type="text" id="titulo"
        	   required maxlength="80">
  	</div>

	<div>
    	<label for="descripcion">Descripción</label>
    	<textarea id="descripcion"></textarea>
  	</div>

  	<div>
    	<label for="prioridad">Prioridad</label>
    	<select id="prioridad">
      	   <option>baja</option>
      	   <option>media</option>
      	   <option>alta</option>
    	</select>
  	</div>

  	<button type="submit">Crear tarea</button>

	</form>
      </section>
    </main>
    <footer>
      <p>Panel de actividades, hecho con HTML</p>
    </footer>
  </body>
</html>
